<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Soggy Scoop • SB Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="SB Racing">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <link rel="icon" type="image/png" href="/assets/favicon-32x32.png">
    <script>
    (function () {
      try {
        var native = false;
        var proto = String(location.protocol || '');
        if (proto === 'capacitor:' || proto === 'ionic:') native = true;
        else if (window.Capacitor) {
          if (typeof Capacitor.isNativePlatform === 'function' && Capacitor.isNativePlatform()) native = true;
          else {
            var p = typeof Capacitor.getPlatform === 'function' ? Capacitor.getPlatform() : '';
            if (p === 'ios' || p === 'android') native = true;
          }
        }
        if (native) {
          document.documentElement.classList.add('is-native-app');
          document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('is-native-app');
          });
        }
      } catch (e) {}
    })();
    </script>
</head>
<body class="bg-zinc-950 text-zinc-200">
<div id="site-nav"></div>
<div class="page-top-spacer" aria-hidden="true"></div>

<div class="page-body">
  <section class="max-w-lg mx-auto px-4 pt-6 pb-10 sm:pt-8">

    <div class="mb-5">
      <div class="flex items-center justify-between gap-3 mb-1">
        <div class="uppercase tracking-[3px] text-[11px] font-semibold text-orange-600">SOGGY SCOOP</div>
        <button type="button" id="refresh-feed" class="text-xs text-zinc-500 hover:text-orange-500 flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
      <h1 class="text-3xl font-black tracking-tighter leading-none">News</h1>
      <p class="text-sm text-zinc-400 mt-1.5">Club updates, trail notes &amp; what's happening</p>
    </div>

    <div id="news-admin-bar" class="hidden mb-5">
      <button type="button" id="news-compose-open"
        class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-orange-600 hover:bg-orange-700 font-semibold text-sm text-white active:scale-[0.985] transition-all">
        <i class="fa-solid fa-plus"></i> New post
      </button>

      <div id="news-compose-form" class="hidden mt-3 p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-3">
        <div class="text-sm font-semibold text-white" id="news-compose-heading">New post</div>

        <div>
          <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1">Title</label>
          <input id="news-title" type="text" maxlength="120" placeholder="Short headline"
            class="w-full px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-orange-600">
        </div>

        <div>
          <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1">Body</label>
          <textarea id="news-body" rows="4" maxlength="2000" placeholder="What's going on…"
            class="w-full px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-orange-600 resize-y"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1">Category</label>
            <select id="news-category"
              class="w-full px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm text-white focus:outline-none focus:border-orange-600">
              <option value="club">Club</option>
              <option value="event">Event</option>
              <option value="ride">Ride</option>
              <option value="alert">Alert</option>
            </select>
          </div>
          <div class="flex items-end pb-1">
            <label class="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer">
              <input id="news-pinned" type="checkbox" class="rounded border-zinc-600 bg-zinc-950 text-orange-600 focus:ring-orange-600">
              Pin to top
            </label>
          </div>
        </div>

        <div>
          <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1">Optional link</label>
          <input id="news-link-url" type="url" placeholder="https://… or events.html"
            class="w-full px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-orange-600 mb-2">
          <input id="news-link-label" type="text" maxlength="40" placeholder="Link label (e.g. View event)"
            class="w-full px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-700 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-orange-600">
        </div>

        <div>
          <label class="block text-[11px] uppercase tracking-wider text-zinc-500 mb-1">Picture</label>
          <input type="hidden" id="news-image-url" value="">
          <div class="flex items-center gap-3">
            <label class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm text-zinc-200 cursor-pointer active:scale-[0.98]">
              <i class="fa-solid fa-image"></i>
              <span>Choose photo</span>
              <input id="news-image-file" type="file" accept="image/*" class="hidden">
            </label>
            <button type="button" id="news-image-clear" class="hidden text-xs text-red-400 hover:text-red-300">
              Remove
            </button>
          </div>
          <div id="news-image-preview-wrap" class="hidden mt-3">
            <img id="news-image-preview" src="" alt="Preview" class="w-full max-h-56 object-cover rounded-xl border border-zinc-700">
          </div>
          <p id="news-image-status" class="text-[11px] text-zinc-500 mt-1.5 hidden"></p>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" id="news-compose-save"
            class="flex-1 px-4 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 font-semibold text-sm text-white">
            Publish
          </button>
          <button type="button" id="news-compose-cancel"
            class="px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm text-zinc-300">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <div id="home-feed" class="space-y-3">
      <div id="feed-loading" class="py-12 text-center text-zinc-500 text-sm">
        <i class="fa-solid fa-spinner fa-spin text-orange-600 text-xl mb-3"></i>
        <p>Loading the scoop…</p>
      </div>
    </div>

    <div id="feed-empty" class="hidden py-10 text-center">
      <div class="w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-newspaper text-zinc-600 text-xl"></i>
      </div>
      <p class="text-sm text-zinc-400 mb-1">No posts yet</p>
      <p class="text-xs text-zinc-600">Admins can publish the first update here</p>
    </div>

  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/shared.js"></script>
<script src="js/home-feed.js"></script>
</body>
</html>
