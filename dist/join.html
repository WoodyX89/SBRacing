<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Join • SB Racing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SB Racing">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <link rel="icon" type="image/png" href="/assets/favicon-32x32.png">
</head>
<body class="bg-zinc-950 text-zinc-200">
<div id="site-nav"></div>
<div class="page-top-spacer" aria-hidden="true"></div>
<div class="page-body">
    <section id="join" class="bg-zinc-900 border-y border-zinc-800 py-20">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-8 md:px-12">
            <div class="max-w-2xl mx-auto text-center mb-10 mt-10">
                <div class="uppercase tracking-[3px] text-xs font-semibold text-orange-600">JOIN THE CREW</div>
                <h2 class="section-header tracking-tighter mt-3">Create your member account</h2>
                <p class="mt-4 text-lg text-zinc-400">Sign up and you are on the list. No application, no approval email.</p>
            </div>

            <div id="apply-success" class="hidden max-w-xl mx-auto bg-zinc-950 border border-emerald-800 rounded-3xl p-8 md:p-10 text-center">
                <i class="fa-solid fa-check-circle text-emerald-500 text-4xl mb-4"></i>
                <h3 class="font-semibold text-xl mb-2">You are in</h3>
                <p id="apply-success-note" class="text-sm text-zinc-400">Taking you to Members…</p>
                <a href="members.html" class="inline-block mt-6 text-sm text-orange-400 hover:text-orange-300">Go to Members →</a>
            </div>

            <div id="apply-card" class="max-w-xl mx-auto bg-zinc-950 border border-zinc-800 rounded-3xl p-8 md:p-10">
                <h3 class="font-semibold text-xl mb-1">Create account</h3>
                <p class="text-sm text-zinc-400 mb-6">Use a real email. You will log in with this on the Members page and in the app.</p>

                <form id="apply-form" onsubmit="submitClubApplication(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="text-xs font-medium tracking-wider text-zinc-400">FULL NAME *</label>
                            <input type="text" id="full-name" required autocomplete="name" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-medium tracking-wider text-zinc-400">EMAIL *</label>
                            <input type="email" id="email" required autocomplete="email" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5">
                        <div>
                            <label class="text-xs font-medium tracking-wider text-zinc-400">PASSWORD *</label>
                            <input type="password" id="password" required minlength="6" autocomplete="new-password" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-medium tracking-wider text-zinc-400">CONFIRM PASSWORD *</label>
                            <input type="password" id="password-2" required minlength="6" autocomplete="new-password" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5">
                        <div>
                            <label class="text-xs font-medium tracking-wider text-zinc-400">PHONE</label>
                            <input type="tel" id="phone" autocomplete="tel" placeholder="403-555-0192" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-medium tracking-wider text-zinc-400">CITY</label>
                            <input type="text" id="city" value="Medicine Hat" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                        </div>
                    </div>

                    <div class="mt-5">
                        <label class="text-xs font-medium tracking-wider text-zinc-400">RIDING EXPERIENCE</label>
                        <select id="experience" class="mt-1.5 w-full bg-zinc-900 border border-zinc-700 focus:border-orange-600 transition-colors rounded-2xl px-5 py-3 text-sm outline-none">
                            <option value="">Optional</option>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>
                    </div>

                    <button type="submit" id="apply-submit"
                            class="mt-8 w-full py-4 rounded-3xl bg-white hover:bg-amber-100 active:scale-[0.985] font-bold text-zinc-900 tracking-wider text-sm transition-all">
                        CREATE ACCOUNT
                    </button>
                    <p class="text-center text-[10px] text-zinc-500 mt-4">Already have an account? <a href="members.html" class="text-orange-400">Log in</a></p>
                </form>
            </div>
        </div>
    </section>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/shared.js"></script>
<script src="js/join.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var swUrl = 'sw.js';
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      fetch(swUrl, { method: 'HEAD' }).then(function (res) {
        if (res.ok) navigator.serviceWorker.register(swUrl).catch(function () {});
        else regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {
        regs.forEach(function (r) { r.unregister(); });
      });
    });
  });
}
</script>
</body>
</html>
