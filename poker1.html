<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Poker Run • SB Racing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="/assets/logo.png">
</head>
<body class="bg-zinc-950 text-zinc-200" data-page="poker">
<div id="site-nav"></div>
<div class="page-top-spacer" aria-hidden="true"></div>

<main class="max-w-lg mx-auto px-4 py-10">
  <div class="text-xs uppercase tracking-[3px] text-orange-600 font-semibold mb-2">SB Racing</div>
  <h1 id="poker-event-name" class="text-3xl font-black tracking-tighter mb-2">Poker Run</h1>
  <p id="poker-status" class="text-sm text-zinc-400 mb-6"></p>

  <!-- Checkpoint / draw -->
  <section id="poker-stop-panel" class="hidden space-y-6 mb-10">
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
      <div class="text-xs text-zinc-500 uppercase tracking-widest mb-1">Checkpoint</div>
      <div id="poker-stop-name" class="text-2xl font-bold"></div>
      <p id="poker-stop-desc" class="text-sm text-zinc-400 mt-2"></p>
    </div>

    <form onsubmit="joinPokerRun(event)" class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 space-y-4">
      <div class="text-sm font-semibold">Your rider info</div>
      <div>
        <label class="text-xs text-zinc-500">Name *</label>
        <input id="poker-rider-name" required class="mt-1 w-full px-4 py-3 rounded-2xl bg-zinc-950 border border-zinc-700 outline-none focus:border-orange-600">
      </div>
      <div>
        <label class="text-xs text-zinc-500">Email (to resume later)</label>
        <input id="poker-rider-email" type="email" class="mt-1 w-full px-4 py-3 rounded-2xl bg-zinc-950 border border-zinc-700 outline-none focus:border-orange-600">
      </div>
      <button type="submit" class="w-full py-3 rounded-2xl bg-white text-zinc-900 font-semibold">Join / resume run</button>
      <p id="poker-joined" class="hidden text-xs text-emerald-400"><i class="fa-solid fa-check mr-1"></i> Joined — you can draw at this stop</p>
    </form>

    <div class="text-center space-y-4">
      <div id="poker-last-draw" class="hidden flex justify-center gap-3"></div>
      <button type="button" id="btn-draw-card" onclick="drawCard()" class="w-full py-4 rounded-3xl bg-orange-600 hover:bg-orange-700 font-bold text-lg">
        <i class="fa-solid fa-clone mr-2"></i> Draw card
      </button>
      <p class="text-xs text-zinc-500">One draw per checkpoint. Cards are unique in your hand.</p>
    </div>

    <div id="poker-my-hand" class="hidden bg-zinc-900 border border-zinc-800 rounded-3xl p-6"></div>
  </section>

  <!-- Leaderboard -->
  <section id="poker-lb-panel" class="mb-10">
    <div id="poker-leaderboard" class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6"></div>
  </section>

  <p class="text-center text-xs text-zinc-600">
    <a href="events.html" class="text-orange-500 hover:underline">← Back to events</a>
  </p>
</main>

<div id="success-toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-8 py-3 rounded-2xl shadow-xl flex items-center gap-x-3 text-sm font-medium z-[100]">
  <i class="fa-solid fa-check-circle"></i><span id="toast-message"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/shared.js"></script>
<script src="js/poker.js"></script>
</body>
</html>
