<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forum • SB Racing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SB Racing">
<link rel="apple-touch-icon" href="/assets/logo.JPG">
    <link rel="icon" type="image/png" href="/assets/favicon-32x32.png">   
</head>
<body class="bg-zinc-950 text-zinc-200">
<div id="site-nav"></div>
<div class="page-top-spacer" aria-hidden="true"></div>

<div class="page-body">
  <section class="max-w-3xl mx-auto px-4 sm:px-8 py-16 sm:py-20">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-8">
      <div>
        <div class="uppercase tracking-[3px] text-xs font-semibold text-orange-600">MEMBERS</div>
        <h1 class="section-header tracking-tighter">Trail Talk</h1>
      </div>
    </div>

    <!-- Login wall -->
    <div id="forum-login-wall" class="hidden bg-zinc-900 border border-zinc-700 rounded-3xl p-10 text-center">
      <i class="fa-solid fa-comments text-4xl text-orange-600 mb-4"></i>
      <h2 class="text-xl font-semibold">Members only</h2>
      <p class="text-sm text-zinc-400 mt-2 mb-6">Log in to read and post in the forum.</p>
      <a href="members.html" class="inline-flex px-6 py-3 rounded-2xl bg-orange-600 hover:bg-orange-700 font-semibold text-white">Log in</a>
    </div>

    <div id="forum-app" class="hidden space-y-6">
      <!-- Composer -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 space-y-4">
        <div class="flex gap-2 text-sm">
          <button type="button" id="tab-post" onclick="setComposerMode('post')" class="px-4 py-2 rounded-2xl bg-orange-600 text-white font-semibold">Post</button>
          <button type="button" id="tab-poll" onclick="setComposerMode('poll')" class="px-4 py-2 rounded-2xl border border-zinc-700 text-zinc-300 hover:bg-zinc-800">Poll</button>
        </div>
        <textarea id="forum-body" rows="3" placeholder="What's on the trails?" class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 text-sm outline-none focus:border-orange-600 resize-y"></textarea>

        <div id="poll-options-wrap" class="hidden space-y-2">
          <div class="text-xs font-medium text-zinc-400 uppercase tracking-wider">Poll options</div>
          <div id="poll-options-list" class="space-y-2"></div>
          <button type="button" onclick="addPollOptionRow()" class="text-sm text-orange-500 hover:text-orange-400"><i class="fa-solid fa-plus mr-1"></i> Add option</button>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <label class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border border-zinc-700 hover:bg-zinc-800 cursor-pointer text-sm">
            <i class="fa-solid fa-image text-orange-500"></i>
            <span>Photo</span>
            <input type="file" id="forum-image" accept="image/*" class="hidden" onchange="onForumImagePicked(event)">
          </label>
          <label class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border border-zinc-700 hover:bg-zinc-800 cursor-pointer text-sm">
            <i class="fa-solid fa-video text-orange-500"></i>
            <span>Video</span>
            <input type="file" id="forum-video" accept="video/*" class="hidden" onchange="onForumVideoPicked(event)">
          </label>
          <span id="forum-image-name" class="text-xs text-zinc-500 truncate max-w-[140px]"></span>
          <button type="button" id="forum-image-clear" onclick="clearForumImage()" class="hidden text-xs text-red-400">Remove</button>
          <button type="button" onclick="submitForumPost()" class="ml-auto px-5 py-2.5 rounded-2xl bg-white text-zinc-900 font-semibold text-sm hover:bg-amber-50 active:scale-[0.98]">
            Post
          </button>
        </div>
        <div id="forum-image-preview" class="hidden">
          <img src="" alt="" class="max-h-40 rounded-2xl border border-zinc-700 object-cover">
          <video src="" class="hidden max-h-40 w-full rounded-2xl border border-zinc-700 bg-black" controls playsinline muted></video>
        </div>
      </div>

      <!-- Feed -->
      <div id="forum-feed" class="space-y-4">
        <div class="flex justify-center py-12 text-zinc-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
      </div>
    </div>
  </section>

  

<!-- Shared footer + cart + toast (edit partials/footer.html only) -->
<div id="site-footer"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/shared.js"></script>
<script src="js/native-notifications.js"></script>
<script src="js/push-notifications.js"></script>
<script src="js/forum.js"></script>
</body>
</html>
